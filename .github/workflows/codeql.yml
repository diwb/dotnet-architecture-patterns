name: codeql
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ArchitecturePatterns.slnx
      - run: dotnet build ArchitecturePatterns.slnx -c Release --no-restore
      - uses: github/codeql-action/analyze@v3
