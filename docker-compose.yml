services:
  clean-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 30s
      timeout: 10s
      retries: 3
  archtool:
    build:
      context: .
      dockerfile: Dockerfile.cli
    command: ["doctor", "--json"]
